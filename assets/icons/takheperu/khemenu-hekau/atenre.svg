  <path fill="#000000" fill-rule="evenodd" d="M4 4h56v56H4V4Zm5 5v46h46V9H9Z"/>
  <circle fill="#000000" cx="32" cy="32" r="9"/>
  <rect fill="#000000" x="30" y="13" width="4" height="6"/>
  <rect fill="#000000" x="30" y="45" width="4" height="6"/>
  <rect fill="#000000" x="13" y="30" width="6" height="4"/>
  <rect fill="#000000" x="45" y="30" width="6" height="4"/>
</svg>
