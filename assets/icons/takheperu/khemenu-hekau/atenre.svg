<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER ART — provisional mark for Aten'ré (Sun), to be replaced with final artwork.
     Filled shapes only, fill as an attribute: utils/svg-theme.mjs rewrites fill (not
     stroke), so a stroked placeholder would stay black and vanish on dark ground. -->
