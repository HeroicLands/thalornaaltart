# See `@heroiclands/package-build` for the full documentation.

contentPackage: thalornaaltart
packageKind: modules

compatibility:
    minimum: "14.359"
    verified: "14.364"

relationships:
    # The art this module ships answers to Thalorna's addresses, so without
    # Thalorna installed it shadows nothing and has nothing to say.
    requires:
        - id: thalorna
          type: module
          manifest: https://github.com/HeroicLands/thalorna/releases/latest/download/module.json
          contentIndex: false
          # The dependency is for Foundry only; this package cites nothing from its content.

# The floor: the authored homepage at /thalornaaltart/ and no other page. There
# is no content tree to publish beyond it — this module ships pictures.
publish:
    site: homepage
    # The module's content *is* its homepage, so it mounts at the package root
    # and the prefix is empty.
    address:
        prefix: ""

site:
    notfound:
        tagline: "This module has one page, and it is not at"
        sitenoun: "module"
        links:
            - title: Thalorna Alternative Art
              url: /
              text: "What this module replaces, and how to install it."
            - title: Thalorna
              url: "https://www.heroiclands.org/thalorna/"
              text: "The setting whose artwork this module replaces."
            - title: Song of Heroic Lands
              url: "https://www.heroiclands.org/sohl/"
              text: "The Foundry VTT system both are built for."

stats:
    lastModifiedBy: hlbuilder0000000

# This module compiles no documents. It ships files, which is what an
# alternative-art module is: the same addresses Thalorna publishes, resolving to
# different pictures when this module is installed and enabled.
packs: []

packageBuild:
    assets:
        - { from: src/thalornaaltart.mjs, to: thalornaaltart.mjs }
        - { from: README.md, to: README.md }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: src/LICENSE, to: src/LICENSE }
        - { from: assets/icons, to: assets/icons }
        - { from: assets/images, to: assets/images }
        - { from: assets/LICENSE, to: assets/LICENSE }

    # The shipped transform: an icon's default-black fill follows the reader's
    # colour scheme, so a substituted icon and the one it replaces sit the same
    # way in a compendium listing.
    assetTransform: svg-theme

    manifest:
        title: Thalorna Module Alternative Art
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
        languages: []
        esmodules:
            - thalornaaltart.mjs
        styles: []
