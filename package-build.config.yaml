contentPackage: thalornaaltart
packageKind: modules

compatibility:
    minimum: "14.359"
    verified: "14.364"

relationships:
    # The art this module ships answers to Thalorna's addresses, so without
    # Thalorna installed it shadows nothing and has nothing to say.
    requires:
        - id: thalorna
          type: module
          manifest: https://github.com/HeroicLands/thalorna/releases/latest/download/module.json
          contentIndex: false

# This module ships pictures, not a content tree, so it publishes only the
# homepage.
publish:
    site: homepage
    address:
        prefix: ""

site:
    assets: https://cdn.heroiclands.org
    search: false
    description: Machine-generated artwork for the Thalorna setting module for Foundry VTT.
    notfound:
        tagline: "This module has one page, and it is not at"
        sitenoun: "module"
        links:
            - title: Thalorna Alternative Art
              url: /
              text: "What this module replaces, and how to install it."
            - title: Thalorna
              url: "https://www.heroiclands.org/thalorna/"
              text: "The setting whose artwork this module replaces."
            - title: Song of Heroic Lands
              url: "https://www.heroiclands.org/sohl/"
              text: "The Foundry VTT system both are built for."

stats:
    lastModifiedBy: hlbuilder0000000

# This module ships files that resolve to Thalorna's own addresses, replacing
# its pictures when installed and enabled.
packs: []

packageBuild:
    assets:
        - { from: src/thalornaaltart.mjs, to: thalornaaltart.mjs }
        - { from: README.md, to: README.md }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: src/LICENSE, to: src/LICENSE }
        - { from: assets/icons, to: assets/icons }
        - { from: assets/images, to: assets/images }
        - { from: assets/LICENSE, to: assets/LICENSE }

    # svg-theme makes an icon's default-black fill follow the reader's colour
    # scheme, so a substituted icon sits like the one it replaces in a
    # compendium listing.
    assetTransform: svg-theme

    manifest:
        title: Thalorna Module Alternative Art
        descriptionHtml: Alternative image and icon assets for use with the Thalorna module
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
        languages: []
        esmodules:
            - thalornaaltart.mjs
        styles: []
