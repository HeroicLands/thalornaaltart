name: Version and Release

# The whole release process, from a merged pull request to a downloadable
# module. Nothing here is started by hand.
#
#   1. A pull request declares its bump as a `.changeset/*.md` file.
#   2. Merging it to `main` opens or updates the **Version Packages** pull
#      request: the version bump plus the rewritten CHANGELOG.md.
#   3. Merging *that* leaves no changesets, which is the signal to build the
#      module, package it, and cut the `v<version>` tag and the GitHub Release
#      that Foundry installs from.
#
# The steps live in HeroicLands/.github rather than here, so a fix to them
# reaches every repository at once.
#
# This repository ships a **module**, not an npm package, so there is no publish
# step and no registry credential. The release *is* the tag and its two assets:
# `module.zip`, and the `module.json` an already-installed module checks for
# updates against.

on:
    push:
        branches: [main]
    # Manual recovery: re-runs the decision for a version that is merged and
    # versioned but never got its release. An existing tag is skipped rather
    # than duplicated, so running this is safe.
    workflow_dispatch:

# Declared here rather than in the shared workflow: a called workflow cannot
# grant itself more than its caller holds, so a fixed block there would cap
# every caller at the narrowest set.
permissions:
    contents: write # push the version branch, create the tag and Release
    pull-requests: write # open and update the Version Packages pull request

jobs:
    release:
        uses: HeroicLands/.github/.github/workflows/release-foundry-package.yml@main
        with:
            package-kind: module
