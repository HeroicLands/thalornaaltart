# `baseURL` is the one place the site's address is written down. It carries the
# `/thalornaaltart/` prefix because the routing Worker serves this module's
# pages under that path, and rebuilding at another origin is a one-line edit
# here rather than a sweep through the content.
baseURL = "https://www.heroiclands.org/thalornaaltart/"
locale = "en-us"
title = "Thalorna Alternative Art"

publishDir = "../build/site/thalornaaltart"
themesDir = "../node_modules/@heroiclands"
theme = "hugo-theme"
contentDir = "content"

# This module publishes one page. Every other kind Hugo would emit — a section
# index, a taxonomy, a feed — would be an empty shell around nothing.
disableKinds = ["section", "taxonomy", "term", "RSS", "sitemap"]

[params]
  description = "Machine-generated artwork for the Thalorna setting module for Foundry VTT."
  author = "Tom Rodriguez"
  cdnBaseURL = "https://cdn.heroiclands.org"

  [params.brand]
    logo       = "images/brand/sohl-icon-white.webp"
    licenseURL = "https://www.heroiclands.org/license/"
    discordURL = "https://discord.gg/EwMfkNd3az"

  [params.notfound]
    tagline  = "This module has one page, and it is not at"
    sitenoun = "module"

    [[params.notfound.links]]
      title = "Thalorna Alternative Art"
      url   = "/"
      text  = "What this module replaces, and how to install it."

    [[params.notfound.links]]
      title = "Thalorna"
      url   = "https://www.heroiclands.org/thalorna/"
      text  = "The setting whose artwork this module replaces."

    [[params.notfound.links]]
      title = "Song of Heroic Lands"
      url   = "https://www.heroiclands.org/sohl/"
      text  = "The Foundry VTT system both are built for."
